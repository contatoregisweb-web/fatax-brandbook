name: Lint CSS · Fatax rules

on:
  pull_request:
    paths:
      - '**/*.css'
      - '**/*.html'
      - '.stylelintrc.json'
      - '.stylelintignore'
      - 'stylelint/**'
      - 'package.json'
  push:
    branches: [main]

jobs:
  stylelint:
    name: stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint CSS
        run: npm run lint:css
