<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=brandbook/" />
  <title>Fatax · Brandbook</title>
  <link rel="canonical" href="brandbook/" />
  <style>
    :root {
      --background: #0A0A0A;
      --brand-cream: #F5EBDE;
      --brand-orange: #FF4800;
      --text-secondary: #9C9489;
      --font-sans: Inter, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--brand-cream);
      font-family: var(--font-sans);
    }
    main {
      width: min(560px, calc(100vw - 48px));
      display: grid;
      gap: 16px;
    }
    img { width: 220px; height: auto; }
    p { margin: 0; color: var(--text-secondary); line-height: 1.5; }
    a { color: var(--brand-orange); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="brandbook/shared/logo-fatax-wordmark-cream.svg" alt="Fatax" />
    <p>Redirecionando para o brandbook. Se nada acontecer, <a href="brandbook/">abrir manualmente</a>.</p>
  </main>
</body>
</html>
